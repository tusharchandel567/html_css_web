<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart footer </title>
    <style>
        .title {
            background-color:black;
            color: aliceblue;
            font-size: 20px;
            padding: 15px;
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        footer {
            background-color: black;
            color: aliceblue;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            padding: 10px;
            height: 300px;
            grid-template-columns: 6fr 6fr;
        }
        .col-left{
            display: grid;
            grid-template-columns: 3fr 3fr 3fr 3fr;
        }
        .col-right{
            display: grid;
            grid-template-columns: 6fr 6fr;
            border-left: 2px solid white;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="title">
         BACK TO TOP
    </div>
    <footer>
        <div class="col-left">
            <div>
            col 1
        </div>
        <div>
            col2
        </div>
        <div>
            col - 3
        </div>
        <div>
            col- 4
        </div>
        </div>
        <div class="col-right">
          <div>
            col-1
          </div>
          <div>
            col-2
          </div>
        </div>
    </footer>
</body>
</html>
