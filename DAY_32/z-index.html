        div {
            width: 400px;
            height:200px;
            border-radius: 20px;
            position: absolute;
        }
        .black-card {

            left: 20px;
            z-index: 1;
        }
        .red-card {
            background-color: red;
            top: 40px;
            left: 40px;
            z-index: 2;
        }
        .blue-card {
            background-color: blue;
            top: 60px;
            left: 60px;
            z-index: 3;
        }
        .green-card {
            background-color: green;
            top: 80px;
            left: 80px;
            z-index: 4;
        }
    </style>
</head>
