<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Effects{
            color: red;
            font-size: 20px;
        }
        .ParaEffects{
            color: green;
            font-size: 20px;
        }
        .EffectsPara{
            color: blue;
            font-size: 20px;
        }
        .TextEffectsPara{
            color: yellow;
            font-size: 20px;
        }
        .Effects.Para{
            color: orange;
            font-size: 20px;
        }
        .Effects-Para{
            color: pink;
            font-size: 20px;
        }
        .Para-Effects{
            color: purple;
            font-size: 20px;
        }
        .Para.Effects{
            color: brown;
            font-size: 20px;
        }
        .Para.Effects.Text{
            color: black;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p class="Effects">Para-1</p>
    <p class="ParaEffects">Para-2</p>
    <p class="EffectsPara">Para-3</p>
    <p class="TextEffectsPara">Para-4</p>
    <p class="Effects Para">Para-5</p>
    <p class="Effects-Para">Para-6</p>
    <p class="Para-Effects">Para-7</p>
    <p class="Para Effects">Para-8</p>
    <p class="Para Effects Text">Para-9</p>
</body>
</html>
